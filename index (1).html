<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16202b">
<title>PCM · Peças do equipamento</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#18212c;--ink2:#344050;--muted:#6b7480;--line:#e2e5e9;--line2:#cfd4da;
  --pri:#1d5a87;--pri2:#e7f0f7;--acc:#d98c1f;--ok:#23784a;--okbg:#e5f3ea;--warnbg:#fdf2dc;--warn:#a86a07;--bad:#b42d22;--badbg:#fbe6e3;--hdr:#16202b;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;color:var(--ink)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
header{background:var(--hdr);color:#e8edf2;padding:12px 16px 0;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:15px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#9fb0c0}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tabs span{color:#fff;padding:9px 2px;border-bottom:3px solid var(--acc);font-weight:600;font-size:14px}
main{padding:14px 12px 28px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.tag{font-family:Consolas,Menlo,monospace;font-size:13px;color:var(--ink2)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;background:#eceef1;color:#5d6670}
.pill.pri{background:var(--pri2);color:var(--pri)} .pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
h1{font-size:21px;margin:4px 0 2px;line-height:1.25}
.sub{color:var(--muted);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.motor{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff;overflow:hidden}
.mh2{padding:10px 14px;background:#f7f9fb;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.mh2 .row{display:flex;align-items:center;gap:8px}
.mh2 b.nm{font-size:15px;flex:1;min-width:0}
.mh2 .chev{color:var(--muted);transition:transform .15s;font-size:13px}
.motor.closed .chev{transform:rotate(-90deg)}
.motor.closed .lst{display:none}
.spec{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:5px}
.spec span b{color:var(--muted);font-weight:500;margin-right:3px}
.thead{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:6px 14px;background:#fbfbfc;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
.p{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f1f3;align-items:start}
.p:last-child{border-bottom:0}
.q{height:30px;border-radius:7px;background:var(--pri2);color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-variant-numeric:tabular-nums}
.d b{display:block;font-size:15.5px;line-height:1.3}
.d .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.d .m .tag{background:#f3f4f6;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.empty{padding:14px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:inherit;background:#fff;margin-bottom:12px}
.search:focus{outline:2px solid #9cc3e0;border-color:var(--pri)}
.note{background:#f7f9fb;border:1px dashed var(--line2);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.err{background:var(--badbg);color:var(--bad);padding:16px;border-radius:10px}
mark{background:#fde9b8;color:inherit;border-radius:2px}
</style>
</head>
<body>
<header><div class="brand" id="brand">PCM · Manutenção<small>Planejamento e Controle da Manutenção</small></div><div class="tabs"><span id="aba">Peças e componentes</span></div></header>
<main id="m"><div class="card">Carregando…</div></main>
<script>
"use strict";
const esc = v => (v == null ? '' : String(v)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v).toLocaleString('pt-BR', {maximumFractionDigits: 2});
function b64uDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function decode(v) {
  const kind = v[0], bytes = b64uDecode(v.slice(1));
  if (kind === 'z') {
    if (!window.DecompressionStream) throw new Error('O navegador do celular está desatualizado. Atualize o Chrome/Safari e escaneie de novo.');
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
let X = null, filtro = '';
const hl = s => { s = esc(s); if (!filtro) return s; const f = esc(filtro).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return s.replace(new RegExp(f, 'gi'), x => `<mark>${x}</mark>`); };
const passa = p => !filtro || p.slice(1).join(' ').toLowerCase().includes(filtro.toLowerCase());
function specHTML(o) {
  const s = [];
  if (o.cv) s.push(`<span><b>cv</b>${num(o.cv)}</span>`);
  if (o.kw) s.push(`<span><b>kW</b>${num(o.kw)}</span>`);
  if (o.rpm) s.push(`<span><b>rpm</b>${num(o.rpm)}</span>`);
  if (o.ca) s.push(`<span><b>carcaça</b>${esc(o.ca)}</span>`);
  if (o.fa) s.push(`<span><b>fab.</b>${esc(o.fa)}</span>`);
  if (!s.length && o.x) s.push(`<span>${esc(o.x)}</span>`);
  return s.length ? `<div class="spec">${s.join('')}</div>` : '';
}
function lista(l) {
  const f = (l || []).filter(passa);
  if (!f.length) return `<div class="empty">${filtro ? 'Nenhuma peça corresponde à busca.' : 'Nenhuma peça cadastrada.'}</div>`;
  return `<div class="thead"><span>Qtd</span><span>Componente / peça</span></div>` + f.map(([q, d, marca, pos, cod]) =>
    `<div class="p"><div class="q">${esc(num(q))}</div><div class="d"><b>${hl(d)}</b><div class="m">${pos ? `<span class="pill pri">${hl(pos)}</span>` : ''}${marca ? `<span class="pill">${hl(marca)}</span>` : ''}${cod ? `<span class="tag">${hl(cod)}</span>` : ''}</div></div></div>`).join('');
}
function bloco(titulo, sub, specs, pecas, aberto = true) {
  if (filtro && !(pecas || []).some(passa)) return '';
  return `<div class="motor ${aberto ? '' : 'closed'}"><div class="mh2" onclick="this.parentNode.classList.toggle('closed')"><div class="row">${titulo}<span class="chev">▼</span></div>${sub || ''}${specs || ''}</div><div class="lst">${lista(pecas)}</div></div>`;
}
const totPecas = l => (l || []).reduce((s, p) => s + (+p[0] || 0), 0);
function desenhar() {
  const m = document.getElementById('m'), x = X;
  let h = '';
  if (x.k === 'm') {
    document.getElementById('aba').textContent = 'Peças do motor';
    h += `<div class="card"><span class="tag">${esc(x.t)}</span> <span class="pill pri">MOTOR</span><h1>${esc(x.d || 'Motor')}</h1><div class="sub">${esc(x.e)}${x.s ? ' · ' + esc(x.s) : ''}</div>${specHTML(x)}</div>`;
    h += `<div class="kpis" style="grid-template-columns:repeat(2,1fr)"><div class="kpi"><div class="l">Itens diferentes</div><div class="v">${(x.p || []).length}</div></div><div class="kpi"><div class="l">Peças instaladas</div><div class="v">${num(totPecas(x.p))}</div></div></div>`;
    if ((x.p || []).length > 6) h += `<input class="search" placeholder="Buscar peça (ex.: 6309, selo)…" value="${esc(filtro)}" oninput="filtro=this.value;desenhar();this.focus()" id="bq">`;
    h += bloco('<b class="nm">Peças e componentes deste motor</b>', '', '', x.p);
  } else {
    const mot = x.m || [], cv = mot.reduce((s, o) => s + (+o.cv || 0), 0), kw = mot.reduce((s, o) => s + (+o.kw || 0), 0);
    const nItens = (x.p || []).length + mot.reduce((s, o) => s + (o.p || []).length, 0);
    document.getElementById('aba').textContent = 'Motores e componentes';
    h += `<div class="card"><span class="tag">${esc(x.t)}</span> <span class="pill pri">EQUIPAMENTO</span><h1>${esc(x.e)}</h1><div class="sub">${esc(x.s || '')}${x.x ? ' · ' + esc(x.x) : ''}</div></div>`;
    h += `<div class="kpis"><div class="kpi"><div class="l">Motores</div><div class="v">${mot.length}</div></div><div class="kpi"><div class="l">Potência</div><div class="v">${cv ? num(cv) + ' <span style="font-size:13px">cv</span>' : '—'}</div></div><div class="kpi"><div class="l">Itens cadastrados</div><div class="v">${nItens}</div></div></div>`;
    if (nItens > 6) h += `<input class="search" placeholder="Buscar peça (ex.: 6309, selo, correia)…" value="${esc(filtro)}" oninput="filtro=this.value;desenhar();this.focus()" id="bq">`;
    const ini = h.length;
    mot.forEach((o, i) => { const n = (o.p || []).length; h += bloco(`<b class="tag">${esc(o.t)}</b><b class="nm">${esc(o.d || 'Motor')}</b><span class="pill">${n} ${n === 1 ? 'item' : 'itens'}</span>`, '', specHTML(o), o.p, mot.length <= 3 || !!filtro || i === 0); });
    if ((x.p || []).length || !mot.length) h += bloco('<b class="nm">Componentes gerais do equipamento</b>', '<div class="sub" style="margin-top:3px">correias, selos, mancais e peças sem motor associado</div>', '', x.p);
    if (filtro && h.length === ini) h += '<div class="card" style="color:var(--muted)">Nenhuma peça corresponde à busca.</div>';
  }
  h += `<div class="note">Etiqueta impressa em <b>${esc(x.dt || '')}</b>. Se algum componente foi trocado por outro modelo depois dessa data, confira no sistema de PCM antes de requisitar a peça ao almoxarifado.</div>`;
  m.innerHTML = h;
  const bq = document.getElementById('bq'); if (bq && filtro) { bq.focus(); bq.setSelectionRange(bq.value.length, bq.value.length); }
}
async function main() {
  const m = document.getElementById('m');
  const v = new URLSearchParams(location.hash.slice(1)).get('v');
  if (!v) { m.innerHTML = '<div class="card"><h1>Visualizador de etiquetas</h1><div class="sub">Escaneie o QR code colado no equipamento ou no motor para ver as peças que o compõem.</div></div>'; return; }
  try {
    X = await decode(v); filtro = '';
    if (X.c) document.getElementById('brand').innerHTML = `PCM · ${esc(X.c.replace(/\s+(Ind[uú]stria|Ltda|S\.?A\.?|ME|EPP).*$/i, ''))}<small>Planejamento e Controle da Manutenção</small>`;
    document.title = `${X.t} · peças`;
    desenhar();
  } catch (e) {
    m.innerHTML = `<div class="err"><b>Não foi possível ler esta etiqueta.</b><br>${esc(e.message || '')}</div>`;
  }
}
main(); window.addEventListener('hashchange', main);
</script>
</body>
</html>
